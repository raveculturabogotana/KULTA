<main class="pg"><section class="band"><video src="/assets/0601524a7c39f9ce60d40136b4063276.mp4" autoplay="" muted="" loop="" playsinline="" preload="auto" aria-hidden="true"></video><a class="back" href="/RaveYPolitica.html">← Rave y política</a><h1>Cómic</h1></section><section class="cmc"><div class="cmk" role="region" aria-roledescription="carrusel" aria-label="Cómic"><button class="cmk-b cmk-prev" type="button" aria-label="Imagen anterior">←</button><div class="cmk-m"><div class="cmk-t"><figure class="cmk-s"><img src="/assets/9746c216a88ee71c3695228d784ac4d0.jpg" alt="Cómic, página 1 de 11" loading="eager"><figcaption>El rave es más que una simple fiesta; es una cultura. Como con todas las culturas, siempre existen mitos, y sobre nosotros se dicen muchas cosas...</figcaption></figure><figure class="cmk-s"><img src="/assets/522a81ba7750cca3586f5b60e9dfd6eb.jpg" alt="Cómic, página 2 de 11" loading="lazy"><figcaption>Dicen que si somos drogos, que si es solo ruido sin sentido o que si no somos más que vagos, pero las cosas no son así.</figcaption></figure><figure class="cmk-s"><img src="/assets/ac0246fcdd9acf33c1ac9b7ba7ce0acd.jpg" alt="Cómic, página 3 de 11" loading="lazy"><figcaption>El rave va más allá de la música; se trata de la conexión, de la gente y de los sentidos...</figcaption></figure><figure class="cmk-s"><img src="/assets/8a10a407c6dae8fbb0feb9f2d557050b.jpg" alt="Cómic, página 4 de 11" loading="lazy"><figcaption>El rave es la fiesta de las experiencias y las sensaciones, es eso que te lleva a un estado de trance a través del ritmo de la música...</figcaption></figure><figure class="cmk-s"><img src="/assets/f4b0ca1d17ab2de90bbb08c8eefac2aa.jpg" alt="Cómic, página 5 de 11" loading="lazy"><figcaption>Es cierto que existen personas que usan drogas para aumentar el impacto del trance, pero no es necesario utilizarlas para disfrutar el rave.</figcaption></figure><figure class="cmk-s"><img src="/assets/c0a88f3bb491d758191e42caf347e299.jpg" alt="Cómic, página 6 de 11" loading="lazy"><figcaption>Tal vez es por esto que existen personas que no entienden lo que hacemos y consideran que no somos más que un montón de vagos ruidosos.</figcaption></figure><figure class="cmk-s"><img src="/assets/2573f6c6a6868f39410f944e1c433a5e.jpg" alt="Cómic, página 7 de 11" loading="lazy"><figcaption>Desde sus orígenes, el rave surgió como una manera de mostrar el inconformismo y la divergencia del sistema. Es por eso que era común hacer raves en espacios abandonados, y todavía sigue siendo común hacerlo en espacios públicos como una manera de apropiarse del espacio.</figcaption></figure><figure class="cmk-s"><img src="/assets/a0d1825bdf3b5cd8a359c11225cca525.jpg" alt="Cómic, página 8 de 11" loading="lazy"><figcaption>Este inconformismo y esta muestra de nuestra cultura también se ve reflejada en nuestra manera de vestir, mezclando ropa cómoda para moverse, al mismo tiempo que expresamos nuestra libertad mostrando nuestro cuerpo sin que nos juzguen.</figcaption></figure><figure class="cmk-s"><img src="/assets/54a6b8c188e41e6a716d4a6ac13e0ffc.jpg" alt="Cómic, página 9 de 11" loading="lazy"><figcaption>Nuestra cultura se basa en los principios de paz, amor, unidad y respeto (PLUR, por sus siglas en inglés) que establecen un espacio seguro, libre de juicios y con un fuerte sentido de empatía.</figcaption></figure><figure class="cmk-s"><img src="/assets/81624f01f1fda33dcbc8469962b06a5c.jpg" alt="Cómic, página 10 de 11" loading="lazy"><figcaption>Es justo por eso que el rave no puede fascista; es un espacio de inclusión, al mismo tiempo que de protesta. El rave es político desde su origen como contracultura.</figcaption></figure><figure class="cmk-s"><img src="/assets/c6957761f5ffe80c18af32c63ac46525.jpg" alt="Cómic, página 11 de 11" loading="lazy"><figcaption>Todo esto forma parte de nuestra cultura; nosotros somos más que "una fiesta de revoltosos".</figcaption></figure></div><div class="cmk-c" aria-live="polite">1 / 11</div></div><button class="cmk-b cmk-next" type="button" aria-label="Imagen siguiente">→</button></div><p class="decl">Como autor de éste producto, declaro que no se han utilizado herramientas de IA en la planificación, el desarrollo, ni en ninguna otra parte del proceso creativo de elaboración de este cómic. -Andrés García.</p></section></main>
